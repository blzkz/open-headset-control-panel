name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --select F,E9,B openlogi tests
      - run: python -m unittest discover -s tests -v
      - name: Web app builds and its JavaScript parses
        run: |
          python tools/build_web.py build/web
          # .mjs so older Node versions parse the files as ES modules
          for f in build/web/js/*.js; do cp "$f" "${f%.js}.mjs"; node --check "${f%.js}.mjs"; done

  packages:
    name: Packages
    needs: test
    uses: ./.github/workflows/packages.yml
    with:
      version: 0.0.${{ github.run_number }}
