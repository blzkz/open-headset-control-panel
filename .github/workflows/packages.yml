# Reusable: build every installable, then install each one on a clean container of its
# distro (resolving real dependencies) and run a headless smoke test.
name: Packages

on:
  workflow_call:
    inputs:
      version:
        description: Package version (without leading "v")
        required: true
        type: string
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""

env:
  NFPM_VERSION: "2.48.0"

jobs:
  build:
    name: Build installables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: sed -i 's/^__version__ = .*/__version__ = "${{ inputs.version }}"/' openlogi/__init__.py
      - name: Install nfpm
        run: |
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
          nfpm --version
      - name: deb / rpm / Arch packages
        run: packaging/build-packages.sh "${{ inputs.version }}"
      - name: Python sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/
      - name: AppImage
        run: packaging/appimage/build.sh "${{ inputs.version }}"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: installables
          path: dist/*
          if-no-files-found: error

  install-test:
    name: Install on ${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian 13
            image: debian:trixie
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          - distro: Fedora
            image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - distro: openSUSE Tumbleweed
            image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./dist/*.rpm
          - distro: Arch Linux
            image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installables
          path: dist
      - name: Install package with the distro package manager
        run: ${{ matrix.install }}
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          openlogi-headset --version
          openlogi-headsetctl --list-presets
          openlogi-headset --selftest
          test -f /usr/lib/udev/rules.d/70-openlogi-headset.rules
          test -f /usr/share/applications/openlogi-headset.desktop

  appimage-test:
    name: AppImage on Ubuntu 22.04
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installables
          path: dist
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          chmod +x dist/*.AppImage
          dist/*.AppImage --version
          dist/*.AppImage ctl --list-presets
          dist/*.AppImage --selftest
