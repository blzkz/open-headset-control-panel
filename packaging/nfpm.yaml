# nfpm config: one staged tree → .deb (Debian/Ubuntu/Mint/Pop!_OS), .rpm (Fedora/openSUSE/RHEL-likes)
# and .pkg.tar.zst (Arch/Manjaro/CachyOS/EndeavourOS). Run from the repo root:
#   VERSION=1.2.3 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: open-headset
arch: all
platform: linux
version: ${VERSION}
release: 1
section: sound
priority: optional
maintainer: blzkz <blzkz@users.noreply.github.com>
vendor: Open Headset Control Panel
homepage: https://github.com/blzkz/open-headset-control-panel
license: GPL-3.0-or-later
description: |-
  G HUB-style control panel for gaming headsets: Logitech HID++ models and
  40+ SteelSeries, HyperX, Corsair, Audeze, Sony, Jabra… models through ports
  of the HeadsetControl drivers. Onboard equalizer, sidetone, battery, chat mix,
  microphone and power options, plus voice enhancement and virtual 7.1 surround
  through PipeWire.
# Formerly "OpenLogi Headset": installing this package removes the old one.
conflicts:
  - openlogi-headset
replaces:
  - openlogi-headset
provides:
  - openlogi-headset

contents:
  # Expanded by packaging/build-packages.sh into explicit dir/file entries for
  # usr/share/open-headset and usr/share/doc/open-headset ("type: tree"
  # writes Go's ModeDir bit into Arch's .MTREE → pacman "permissions differ").
  # @TREE@
  - src: build/stage/usr/bin/open-headset
    dst: /usr/bin/open-headset
    file_info: { mode: 0755 }
  - src: build/stage/usr/bin/open-headsetctl
    dst: /usr/bin/open-headsetctl
    file_info: { mode: 0755 }
  - src: build/stage/usr/share/applications/open-headset.desktop
    dst: /usr/share/applications/open-headset.desktop
  - src: build/stage/usr/share/icons/hicolor/scalable/apps/open-headset.svg
    dst: /usr/share/icons/hicolor/scalable/apps/open-headset.svg
  - src: build/stage/usr/share/metainfo/io.github.blzkz.OpenHeadsetControlPanel.metainfo.xml
    dst: /usr/share/metainfo/io.github.blzkz.OpenHeadsetControlPanel.metainfo.xml
  - src: build/stage/usr/lib/udev/rules.d/70-open-headset.rules
    dst: /usr/lib/udev/rules.d/70-open-headset.rules

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh

overrides:
  deb:
    depends:
      - python3 (>= 3.10)
      - python3-pyqt6
      - python3-pyqt6.qtsvg
      - python3-pyqt6.qtmultimedia
      - pipewire-bin
      - pulseaudio-utils
    recommends:
      - pipewire-pulse
      - libspa-0.2-modules
      - libmysofa1
  rpm:
    depends:
      - python3 >= 3.10
      - (python3-pyqt6 or python3-PyQt6)
      - (pipewire-utils or pipewire-tools)
      - pulseaudio-utils
    recommends:
      - pipewire-pulseaudio
      - libmysofa
  archlinux:
    depends:
      - python
      - python-pyqt6
      - qt6-svg
      - qt6-multimedia
      - pipewire
      - libpulse
    suggests:
      - libmysofa
      - pipewire-pulse

rpm:
  group: Applications/Multimedia
  summary: G HUB-style control panel for gaming headsets
deb:
  fields:
    Bugs: https://github.com/blzkz/open-headset-control-panel/issues
archlinux:
  packager: blzkz <blzkz@users.noreply.github.com>
  scripts:
    # pacman runs pre/post_upgrade (not install/remove) on updates
    preupgrade: packaging/scripts/preremove.sh
    postupgrade: packaging/scripts/postinstall.sh
